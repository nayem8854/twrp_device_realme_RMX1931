name: Build TWRP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt update

          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses6 \
            libncurses-dev \
            libsdl1.2-dev \
            libssl-dev \
            libwxgtk3.2-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      #########################################################
      # Restore ccache
      #########################################################

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Initialize Source
        run: |
          repo init \
            --depth=1 \
            -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git \
            -b twrp-12.1

      - name: Repo Sync
        run: |
          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j$(nproc)

      - name: Remove .repo
        run: rm -rf .repo

      - name: Clone Device Tree
        run: |
          mkdir -p device/realme
          git clone --depth=1 \
            https://github.com/nayem8854/twrp_device_realme_RMX1931.git \
            device/realme/samurai

      - name: Build Recovery
        env:
          USE_CCACHE: 1
          CCACHE_DIR: ~/.ccache
        run: |
          ccache -M 10G
          ccache -z

          source build/envsetup.sh
          lunch twrp_samurai-eng
          mka recoveryimage -j$(nproc)

          ccache -s

      #########################################################
      # Upload Artifact
      #########################################################

      - name: Upload Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: recovery
          path: out/target/product/samurai/recovery.img

      #########################################################
      # GitHub Release
      #########################################################

      - name: Generate Tag
        id: tag
        run: |
          echo "tag=TWRP-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: TWRP ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            out/target/product/samurai/recovery.img
